# Smoke test: one word per cell, to check parsing, logging and cost per call before scaling up.
name = "smoke_v2"
base_seed = "smoke-2026-10-25"
words = ["HELLO"]
reps = 1
budget_usd = 2.0
allow_dirty = true
max_usd_per_trial = 0.5
workers = 4
pairs = [
  ["sonnet", "sonnet"],
  ["luna", "luna"],
  ["sonnet", "luna"],
  ["luna", "sonnet"],
]
clean_receivers = ["sonnet", "luna"]

[models.sonnet]
route = "anthropic"
id = "claude-sonnet-5-5"
openrouter_id = "anthropic/claude-sonnet-5.5"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_tokens = 16000, thinking = { type = "adaptive" } }

[models.luna]
route = "openai"
id = "gpt-5.6-luna"
openrouter_id = "openai/gpt-5.6-luna"
usd_per_m_in = 0.20
usd_per_m_out = 1.20
params = { max_completion_tokens = 16000 }
