# Smoke test of the exact paper config on one word, run on the committed code before the main run.
# OpenAI size ladder (direct API) plus frontier models from other labs (OpenRouter). Anthropic models are excluded:
# their API refused stochastically, even under a simulation framing, in smoke tests.
# Prices (USD per million tokens) are list prices used only for the budget cap; providers bill the real amount.
name = "smoke_paper"
base_seed = "smoke-paper-2026-10-25"
words = ["GRAPE"]
reps = 1
budget_usd = 5.0
max_usd_per_trial = 1.0
workers = 8
pairs = [
  # same-model pairs: one per model
  ["luna", "luna"], ["sol", "sol"], ["astra", "astra"],
  ["gemini", "gemini"], ["grok", "grok"], ["qwen", "qwen"], ["deepseek", "deepseek"],
  # cross-lab pairs between the top models, both directions
  ["astra", "gemini"], ["gemini", "astra"], ["astra", "grok"], ["grok", "astra"], ["gemini", "grok"], ["grok", "gemini"],
]
clean_receivers = ["luna", "sol", "astra", "gemini", "grok", "qwen", "deepseek"]

[models.luna]
route = "openai"
id = "gpt-6-luna"
openrouter_id = "openai/gpt-6-luna"
usd_per_m_in = 0.10
usd_per_m_out = 0.50
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.sol]
route = "openai"
id = "gpt-6.1-sol"
openrouter_id = "openai/gpt-6.1-sol"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.astra]
route = "openai"
id = "gpt-6-astra"
openrouter_id = "openai/gpt-6-astra"
usd_per_m_in = 10.0
usd_per_m_out = 50.0
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.gemini]
route = "openrouter"
id = "google/gemini-4-argon"
openrouter_id = "google/gemini-4-argon"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }

[models.grok]
route = "openrouter"
id = "x-ai/grok-4.7"
openrouter_id = "x-ai/grok-4.7"
usd_per_m_in = 2.0
usd_per_m_out = 6.0
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }

[models.qwen]
route = "openrouter"
id = "qwen/qwen3.8-max-prime"
openrouter_id = "qwen/qwen3.8-max-prime"
usd_per_m_in = 4.0
usd_per_m_out = 12.0
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }

[models.deepseek]
route = "openrouter"
id = "deepseek/deepseek-v4-pro"
openrouter_id = "deepseek/deepseek-v4-pro"
usd_per_m_in = 0.21
usd_per_m_out = 0.42
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }
