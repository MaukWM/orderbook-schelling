# Smoke test of the exact paper config on one word, run on the committed code before the main run.
# Size ladders per lab (direct APIs, company budget) plus single frontier points from other labs (OpenRouter).
# Prices (USD per million tokens) are list prices used only for the budget cap; providers bill the real amount.
name = "smoke_paper"
base_seed = "smoke-paper-2026-10-25"
# five-letter common English words with no meaning in finance or trading, no numbers, no company or ticker names
words = ["HELLO"]
reps = 1
budget_usd = 5.0
max_usd_per_trial = 1.0
workers = 8
pairs = [
  # same-model pairs: one per model
  ["haiku", "haiku"], ["sonnet", "sonnet"], ["opus", "opus"], ["fable", "fable"],
  ["luna", "luna"], ["sol", "sol"], ["astra", "astra"],
  ["gemini", "gemini"], ["grok", "grok"], ["qwen", "qwen"], ["deepseek", "deepseek"],
  # cross-lab pairs between the top models, both directions
  ["opus", "astra"], ["astra", "opus"], ["opus", "gemini"], ["gemini", "opus"], ["astra", "gemini"], ["gemini", "astra"],
]
clean_receivers = ["haiku", "sonnet", "opus", "fable", "luna", "sol", "astra", "gemini", "grok", "qwen", "deepseek"]

[models.haiku]
route = "anthropic"
id = "claude-haiku-5-5"
openrouter_id = "anthropic/claude-haiku-5.5"
usd_per_m_in = 0.10
usd_per_m_out = 0.50
params = { max_tokens = 16000, thinking = { type = "adaptive" }, output_config = { effort = "medium" } }

[models.sonnet]
route = "anthropic"
id = "claude-sonnet-5-5"
openrouter_id = "anthropic/claude-sonnet-5.5"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_tokens = 16000, thinking = { type = "adaptive" }, output_config = { effort = "medium" } }

