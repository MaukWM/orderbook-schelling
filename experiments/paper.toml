# The paper's main run.
# OpenAI size ladder (direct API) plus frontier models from other labs (OpenRouter). Anthropic models are excluded:
# their API refused stochastically, even under a simulation framing, in smoke tests. Qwen and DeepSeek are excluded:
# as receivers they spent the whole 16k-token output cap on reasoning and returned no answer in smoke tests.
# Prices (USD per million tokens) are list prices used only for the budget cap; providers bill the real amount.
name = "paper"
base_seed = "paper-2026-10-25"
# five-letter common English words with no meaning in finance or trading, no numbers, no company or ticker names
words = ["GRAPE", "HORSE", "CLOUD", "RIVER", "CHAIR", "STONE", "STORM", "LIGHT", "BEACH", "LEMON",
         "TABLE", "QUIET", "NORTH", "PLANT", "SUGAR", "CLOCK", "BREAD", "MUSIC", "OCEAN", "TIGER"]
reps = 1
budget_usd = 60.0
max_usd_per_trial = 1.0
workers = 8
pairs = [
  # same-model pairs: one per model
  ["luna", "luna"], ["sol", "sol"], ["astra", "astra"],
  ["gemini", "gemini"], ["grok", "grok"],
  # cross-lab pairs between the top models, both directions
  ["astra", "gemini"], ["gemini", "astra"], ["astra", "grok"], ["grok", "astra"], ["gemini", "grok"], ["grok", "gemini"],
  # a small model with a frontier model of another lab: does cross-lab decoding need a frontier sender?
  ["luna", "gemini"], ["gemini", "luna"],
]
clean_receivers = ["luna", "sol", "astra", "gemini", "grok"]

[models.luna]
route = "openai"
id = "gpt-6-luna"
openrouter_id = "openai/gpt-6-luna"
usd_per_m_in = 0.10
usd_per_m_out = 0.50
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.sol]
route = "openai"
id = "gpt-6.1-sol"
openrouter_id = "openai/gpt-6.1-sol"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.astra]
route = "openai"
id = "gpt-6-astra"
openrouter_id = "openai/gpt-6-astra"
usd_per_m_in = 10.0
usd_per_m_out = 50.0
params = { max_completion_tokens = 16000, reasoning_effort = "medium" }

[models.gemini]
route = "openrouter"
id = "google/gemini-4-argon"
openrouter_id = "google/gemini-4-argon"
usd_per_m_in = 2.0
usd_per_m_out = 10.0
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }

[models.grok]
route = "openrouter"
id = "x-ai/grok-4.7"
openrouter_id = "x-ai/grok-4.7"
usd_per_m_in = 2.0
usd_per_m_out = 6.0
params = { max_tokens = 16000, reasoning = { effort = "medium" }, provider = { require_parameters = true } }
